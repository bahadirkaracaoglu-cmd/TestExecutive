dut: ModelX-Rev2
byte_order: little
messages:
  INIT_REQ:
    id: '0x10'
    direction: tx
    response: INIT_RSP
    group: init
    description: DUT'u başlatır
    fields:
    - name: mode
      offset: 0
      type: uint8
      default: NORMAL
      enum:
        NORMAL: 0
        TEST: 1
    - name: init_params
      offset: 1
      type: bytes
      size: 3
      default: 00 00 00
      description: payload byte 1-3 (init parametreleri)
    - name: timeout_ms
      offset: 4
      type: uint16
      default: 500
      unit: ms
  INIT_RSP:
    id: '0x90'
    direction: rx
    group: init
    fields:
    - name: status
      offset: 0
      type: uint8
      enum:
        OK: 0
        ERR: 1
    - name: fw_major
      offset: 1
      type: uint8
    - name: fw_minor
      offset: 2
      type: uint8
    - name: temp
      offset: 3
      type: int16
      scale: 0.1
      unit: °C
    - name: flags
      offset: 5
      type: bits
      size: 1
      bits:
        ready: 0
        fault: 1
        low_batt: 2
  GET_VERSION:
    id: '0x01'
    direction: tx
    response: VERSION_RSP
    group: diag
  VERSION_RSP:
    id: '0x81'
    direction: rx
    group: diag
    fields:
    - name: version
      offset: 0
      type: ascii
      size: rest
presets:
  fabrika_init:
    INIT_REQ:
      mode: NORMAL
      init_params: A1 B2 C3
      timeout_ms: 1000
  test_modu:
    INIT_REQ:
      mode: TEST
      timeout_ms: 200
